<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='favicon.svg',v='5') }}"><title>DecisionOS · Sign in</title><link rel="stylesheet" href="{{ url_for('static',filename='portal.css') }}"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"><link rel="stylesheet" href="{{ url_for('static',filename='theme.css',v='9') }}"></head><body><main class="auth-page"><div class="panel"><p class="eyebrow">DECISIONOS</p><h1>Connect the dots. Get work done.</h1><p>Sign in to your private workspaces.</p>{% for category,message in get_flashed_messages(with_categories=true) %}<p class="notice {{ category }}">{{ message }}</p>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="password">Owner password</label><input type="password" id="password" name="password" autocomplete="current-password" required><button class="btn primary">Sign in</button></form></div>{% include '_footer.html' %}</main></body></html>
